<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/home.css">
    <link rel="stylesheet" href="../assets/css/product-details.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        crossorigin="anonymous">
</head>

<body>
    <div class="page">
        <div class="nav-bar">
            <header class="custom-navbar py-3 px-4 px-md-5">

                <div class="d-flex justify-content-between">
                    <!-- Top Row Navigation Links, Logo, User Actions -->
                    <div class="d-flex align-items-center justify-content-between">

                        <!-- Left Section: Menu Toggle & Main Links -->
                        <div class="d-flex align-items-center gap-4">
                            <button id="menuToggle" class="btn p-0 border-0 text-dark me-2 d-md-none" type="button"
                                aria-label="Toggle Menu">

                                <i class="bi bi-list fs-3"></i>

                            </button>
                            <ul class="nav d-none d-md-flex align-items-center gap-4 m-0 p-0 list-unstyled">
                                <li><a href="../index.html" class="nav-link-custom active">Home</a></li>
                                <li><a href="./product.html" class="nav-link-custom">Collections</a></li>
                                <li><a href="#new" class="nav-link-custom">New</a></li>
                            </ul>
                        </div>

                    </div>

                    <!-- Center Section: Logo -->
                    <div class="">
                        <a href="../index.html">
                            <img src="../assets/images/nav-logo.png" alt="logo">
                        </a>
                    </div>

                    <!-- Right Section: Wishlist, Cart, Profile Icons -->
                    <div class="d-flex align-items-center  gap-1 gap-md-3">
                        <!-- Wishlist -->
                        <a href="#" class="icon-circle btn-wishlist d-none d-sm-flex">
                            <i class="bi bi-heart"></i>
                        </a>

                        <!-- Cart Button -->
                        <div class="cart-pill-wrapper d-flex align-items-center">
                            <span class="cart-text d-none d-md-inline-block me-1">Cart</span>
                            <a href="cart.html" class="icon-circle bg-white text-dark border border-dark">
                                <i class="bi bi-bag"></i>
                                <i class="cart-counter">0</i>
                            </a>
                        </div>

                        <!-- User Profile -->
                        <a href="./auth.html" class="icon-circle bg-dark text-white">
                            <i class="bi bi-person"></i>
                        </a>
                    </div>
                </div>

        </div>
        <!-- Categories & Search Bar -->


        </header>
        <div class="mobile-menu-overlay" id="menuOverlay"></div>

        <aside class="mobile-menu" id="mobileMenu">

            <div class="mobile-menu-header">
                <img src="../assets/images/nav-logo.png" alt="XIV">

                <button id="closeMenu" class="menu-close">

                </button>
            </div>

            <nav class="mobile-nav">
                <a href="../index.html">Home</a>
                <a href="./product.html">Collections</a>
                <a href="#new">New</a>
            </nav>


        </aside>
        <main class="details-container">
            <div class="breadcrumb">Home / Products / <span id="breadcrumbName">Product</span></div>
            <section class="product-details">
                <div class="details-image-wrap"><img id="productImage" src="../assets/images/product1.jpg"
                        alt="Product"></div>
                <div class="details-info">
                    <p class="details-category" id="productCategory">PRODUCT</p>
                    <h1 id="productName">Product</h1>
                    <div class="details-price" id="productPrice">$199</div>
                    <p class="details-description" id="productDescription"></p>
                    <div class="details-line"></div>
                    <div class="option-block">
                        <div class="option-title">SIZE</div>
                        <div class="size-buttons">
                            <button>XS</button><button>S</button><button>M</button><button>L</button><button>XL</button><button>2X</button>
                        </div>
                    </div>
                    <div class="option-block">
                        <div class="option-title"><span class="add-to-cart">Add to cart to choose product size</span></div>
                        
                    <button class="add-cart" id="addCart">ADD TO CART</button>
                </div>
            </section>
        </main>
    </div>

    <footer class="site-footer">

        <div class="footer-inner">

            <!-- Info -->
            <div class="footer-info">

                <span>INFO</span>

                <a href="#">PRICING</a>
                <a href="#">ABOUT</a>
                <a href="#">CONTACTS</a>

                <div class="footer-languages">

                    <span>LANGUAGES</span>

                    <a href="#">ENG</a>
                    <a href="#">ESP</a>
                    <a href="#">SVE</a>

                </div>

            </div>
            <!-- Logo -->
            <div class="footer-brand">

                <img src="../assets/images/nav-logo.png" alt="">

            </div>
            <!-- Communication -->
            <div class="footer-communication">

                <span>
                    Next-field communication
                </span>

                <div></div>

            </div>

        </div>

    </footer>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/products.js"></script>
    <script src="../assets/js/sync.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/cartt.js"></script>
    <script src="../assets/js/product-details.js"></script>
    
</body>

</html>
