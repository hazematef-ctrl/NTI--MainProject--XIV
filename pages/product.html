<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <link rel="icon" type="image/png" href="../assets/images/logo.png">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/home.css">

    <link rel="stylesheet" href="../assets/css/product.css">
</head>

<body>
    <div class="page">
        <!-- NAVBAR -->
        <header class="nav-bar custom-navbar py-3 px-4 px-md-5">
            <div class="d-flex justify-content-between align-items-center">
                <!-- Left Section: Menu Toggle & Nav -->
                <div class="d-flex align-items-center gap-4">
                    <button id="menuToggle" class="btn p-0 border-0 text-dark me-2 d-md-none" type="button"
                        aria-label="Toggle Menu">
                        <i class="bi bi-list fs-3"></i>
                    </button>
                    <ul class="nav d-none d-md-flex align-items-center gap-4 m-0 p-0 list-unstyled">
                        <li><a href="../index.html" class="nav-link-custom">Home</a></li>
                        <li><a href="./product.html" class="nav-link-custom active">Collections</a></li>
                        <li><a href="../index.html#new" class="nav-link-custom">New</a></li>
                    </ul>
                </div>

                <!-- Center Section: Logo -->
                <div>
                    <a href="../index.html">
                        <img src="../assets/images/nav-logo.png" alt="logo" height="30">
                    </a>
                </div>

                <!-- Right Section: Icons -->
                <div class="d-flex align-items-center gap-2 gap-md-3">
                    <a href="favourite.html" class="icon-circle btn-wishlist d-none d-sm-flex">
                        <i class="bi bi-heart"></i>
                    </a>
                    <div class="cart-pill-wrapper d-flex align-items-center">
                        <span class="cart-text d-none d-md-inline-block me-1">Cart</span>
                        <a href="./cart.html" class="icon-circle bg-white text-dark border border-dark">
                            <i class="bi bi-bag"></i>
                            <i class="cart-counter">0</i>
                        </a>
                    </div>
                    <a href="auth.html" class="icon-circle bg-dark text-white">
                        <i class="bi bi-person"></i>
                    </a>
                </div>
            </div>
        </header>

        <!-- MOBILE MENU OVERLAY & ASIDE -->
        <div class="mobile-menu-overlay" id="menuOverlay"></div>
        <aside class="mobile-menu" id="mobileMenu">
            <div class="mobile-menu-header">
                <img src="../assets/images/nav-logo.png" alt="XIV">
                <button id="closeMenu" class="menu-close"><i class="bi bi-x-lg"></i></button>
            </div>
            <nav class="mobile-nav">
                <a href="../index.html">Home</a>
                <a href="product.html" class="active">Collections</a>
                <a href="../index.html#new">New</a>
            </nav>
        </aside>

        <!-- MAIN CONTENT CONTAINER -->
        <div class="main-container">
            <!-- SIDEBAR FILTERS -->
            <aside class="sidebar">
                <h3>Filters</h3>

                <div class="filter-section">
                    <h4>Size</h4>
                    <div class="sizes">
                        <button class="size-btn" data-size="XS">XS</button>
                        <button class="size-btn" data-size="S">S</button>
                        <button class="size-btn" data-size="M">M</button>
                        <button class="size-btn" data-size="L">L</button>
                        <button class="size-btn" data-size="XL">XL</button>
                        <button class="size-btn" data-size="2X">2X</button>
                    </div>
                </div>

                <div class="filter-section">
                    <div class="filter-title">
                        <h4>Availability</h4>
                        <i class="bi bi-chevron-up"></i>
                    </div>
                    <label>
                        <input id="availableFilter" type="checkbox"> Available <span id="availableCount"></span>
                    </label>
                    <label>
                        <input id="outOfStockFilter" type="checkbox"> Out of Stock <span id="outOfStockCount"></span>
                    </label>
                </div>

                <button class="filter-option" data-filter="category">
                    Category <i class="bi bi-chevron-right"></i>
                </button>
                <div id="categoryFilter" class="filter-dropdown">
                    <button data-value="Shirts">Shirts</button>
                    <button data-value="T-Shirts">T-Shirts</button>
                    <button data-value="Jackets">Jackets</button>
                </div>

                <button class="filter-option" data-filter="color">
                    Colors <i class="bi bi-chevron-right"></i>
                </button>
                <div id="colorFilter" class="filter-dropdown">
                    <button data-value="Black">Black</button>
                    <button data-value="White">White</button>
                    <button data-value="Blue">Blue</button>
                </div>

                <button class="filter-option" data-filter="price">
                    Price Range <i class="bi bi-chevron-right"></i>
                </button>
                <div id="priceFilter" class="filter-dropdown">
                    <button data-min="0" data-max="199">Under $200</button>
                    <button data-min="200" data-max="299">$200 - $299</button>
                    <button data-min="300" data-max="9999">$300+</button>
                </div>

                <button id="clearFilters" class="clear-filters mt-3 btn btn-outline-dark btn-sm w-100">Clear
                    Filters</button>
            </aside>

            <!-- PRODUCTS AREA -->
            <main class="products-area">
                <div class="breadcrumb">Home / Products</div>
                <h1 class="page-title">PRODUCTS</h1>

                <!-- Search & Quick Categories -->
                <div class="top-products">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input id="productSearch" type="text" placeholder="Search products...">
                    </div>

                    <div class="categories">
                        <button data-collection="New">NEW</button>
                        <button data-category="Shirts">SHIRTS</button>
                        <button data-category="Polo Shirts">POLO</button>
                        <button data-category="Shorts">SHORTS</button>
                        <button data-category="T-Shirts">T-SHIRTS</button>
                        <button data-category="Jeans">JEANS</button>
                        <button data-category="Jackets">JACKETS</button>
                    </div>
                </div>

                <!-- Products Grid Container -->
                <div id="productsContainer" class="product-grid">
                    <!-- Dynamic products will render here -->
                </div>

                <p id="noProducts" class="no-products d-none">No products found.</p>
            </main>
        </div>

        <footer class="site-footer">

            <div class="footer-inner">

                <!-- Info -->
                <div class="footer-info">

                    <span>INFO</span>

                    <a href="checkout.html">PRICING</a>
                    <a href="about.html">ABOUT</a>
                    <a href="#">CONTACTS</a>

                    <div class="footer-languages">

                        <span>LANGUAGES</span>

                        <a href="#">ENG</a>
                        <a href="#">ESP</a>
                        <a href="#">SVE</a>

                    </div>

                </div>


                <!-- Logo -->
                <div class="footer-brand">

                    <img src="../assets/images/nav-logo.png" alt="">

                </div>





                <!-- Communication -->
                <div class="footer-communication">

                    <span>
                        Next-field communication
                    </span>

                    <div></div>

                </div>

            </div>

        </footer>
    </div>

    <!-- SCRIPTS -->
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/products.js"></script>
    <script src="../assets/js/product.js"></script>
    <script src="../assets/js/sync.js"></script>
    <script src="../assets/js/cart.js"></script>
</body>

</html>
